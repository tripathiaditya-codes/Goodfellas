<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOODFELLAS — Root the Impossible. Rise Unstoppable.</title>
<meta name="description" content="GOODFELLAS is a competitive CTF team of cybersecurity enthusiasts: web exploitation, cryptography, reverse engineering, forensics, pwn and OSINT.">
<meta name="theme-color" content="#08090C">
<meta property="og:type" content="website">
<meta property="og:title" content="GOODFELLAS — Root the Impossible. Rise Unstoppable.">
<meta property="og:description" content="A competitive CTF team. Meet the members and try the terminal.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2308090C'/%3E%3Crect x='3' y='3' width='58' height='58' rx='10' fill='none' stroke='%2300FF9C' stroke-width='3'/%3E%3Ctext x='32' y='42' font-family='monospace' font-weight='700' font-size='28' text-anchor='middle' fill='%2300FF9C'%3EGF%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#08090C;--panel:#0D0F14;--line:rgba(255,255,255,.09);--g:#00FF9C;--tx:#E6EDF3;--mut:#8B95A1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(4.5rem + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(8,9,12,.9);z-index:60}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(rgba(0,255,156,.03) 1px,transparent 1px) 0 0/100% 4px}
.grid-bg{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 70%)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:rgba(0,255,156,.55);box-shadow:0 0 28px -8px rgba(0,255,156,.45)}
.caret{display:inline-block;width:.6ch;background:var(--g);animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.glow{text-shadow:0 0 18px rgba(0,255,156,.55)}
.boot{animation:boot 1.1s ease-out both}
@keyframes boot{0%{opacity:0;letter-spacing:.35em;filter:blur(6px)}100%{opacity:1;letter-spacing:-.02em;filter:none}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;z-index:100;background:var(--g);color:#000;padding:.5rem 1rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="root"></div>

<script type="text/plain" id="src">
const { useState, useEffect, useRef } = React;

/* ---------- Editable content: change anything here ---------- */
type Platform = 'GitHub' | 'LinkedIn' | 'TryHackMe';
type Member = { tag: string; name: string; socials: { platform: Platform; url: string }[] };

const SLOGAN = 'Root the Impossible. Rise Unstoppable.';
const MEMBERS: Member[] = [
  { tag: 'RageBear62', name: 'Aditya Tripathi', socials: [
    { platform: 'GitHub', url: 'https://github.com/tripathiaditya-codes' },
    { platform: 'LinkedIn', url: 'https://www.linkedin.com/in/aditya-kumar-tripathi28/' },
    { platform: 'TryHackMe', url: 'https://tryhackme.com/p/Aditya.Tripathi' } ] },
  { tag: 'NodY', name: 'Parth Nagam', socials: [
    { platform: 'GitHub', url: 'https://github.com/NodYwhoo/' },
    { platform: 'LinkedIn', url: 'https://www.linkedin.com/in/parthnagam/' },
    { platform: 'TryHackMe', url: 'https://tryhackme.com/p/NodyWhoo' } ] },
  { tag: 'Sierraaa', name: 'Chirag Dubey', socials: [
    { platform: 'GitHub', url: 'https://github.com/Chirag24-droid' },
    { platform: 'LinkedIn', url: 'https://www.linkedin.com/in/chirag-dubey-5b4327351/' },
    { platform: 'TryHackMe', url: 'https://tryhackme.com/p/Sierraaaa.17' } ] },
];
const EXPERTISE = [
  { g: '</>', t: 'Web Exploitation', d: 'Injection, auth flaws, broken access control and logic bugs.' },
  { g: '0x', t: 'Cryptography', d: 'Classical ciphers, weak primitives and implementation mistakes.' },
  { g: 'RE', t: 'Reverse Engineering', d: 'Reading binaries and bytecode to recover hidden logic.' },
  { g: 'FS', t: 'Digital Forensics', d: 'Disk, memory, network captures and file carving.' },
  { g: '#!', t: 'Pwn', d: 'Memory corruption and binary exploitation.' },
  { g: '@', t: 'OSINT', d: 'Turning public information into verifiable answers.' },
  { g: 'SIEM', t: 'SIEM & Log Analysis', d: 'Querying logs, building detections and tuning alerts in Splunk, Sentinel or Elastic.' },
  { g: 'IR', t: 'Incident Response', d: 'Triage, containment, eradication and recovery, following the IR lifecycle.' },
  { g: 'TH', t: 'Threat Hunting', d: 'Hypothesis-driven hunts for suspicious behavior mapped to MITRE ATT&CK.' },
  { g: 'EDR', t: 'Endpoint Security', d: 'Investigating process trees, persistence and malicious activity on hosts.' },
  { g: 'NTA', t: 'Network Traffic Analysis', d: 'Packet captures, flow data and spotting beaconing or exfiltration.' },
  { g: 'CTI', t: 'Threat Intelligence', d: 'Enriching IOCs and pivoting on indicators to understand attacker behavior.' },
];
const NAV = ['About', 'Team', 'Expertise', 'Terminal', 'Records', 'Contact'];

/* ---------- Icons ---------- */
const PATHS: Record<string, string> = {
  GitHub: 'M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.76 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z',
  LinkedIn: 'M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z',
};
function Icon({ p }: { p: string }) {
  if (p === 'TryHackMe') return (
    <svg viewBox="0 0 24 24" className="w-5 h-5" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="4" fill="none" stroke="currentColor" strokeWidth="1.8"/><text x="12" y="15.5" textAnchor="middle" fontSize="8.5" fontWeight="700" fontFamily="monospace" fill="currentColor">THM</text></svg>);
  return <svg viewBox="0 0 24 24" className="w-5 h-5" fill="currentColor" aria-hidden="true"><path d={PATHS[p]} /></svg>;
}
function Social({ platform, url, who }: { platform: string; url: string; who: string }) {
  return (
    <a href={url} target="_blank" rel="noopener noreferrer" aria-label={`${who} on ${platform} (opens in a new tab)`}
       className="group relative grid place-items-center w-11 h-11 rounded border border-white/10 text-[#8B95A1] transition hover:text-[#00FF9C] hover:border-[#00FF9C]/70 hover:shadow-[0_0_16px_-2px_rgba(0,255,156,.5)] focus-visible:text-[#00FF9C]">
      <Icon p={platform} />
      <span role="tooltip" className="pointer-events-none absolute -top-9 left-1/2 -translate-x-1/2 whitespace-nowrap rounded bg-[#00FF9C] px-2 py-1 text-xs font-bold text-black opacity-0 transition group-hover:opacity-100 group-focus-visible:opacity-100">{platform}</span>
    </a>);
}

/* ---------- Hooks ---------- */
function useTyped(text: string, ms = 55) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setN(text.length); return; }
    if (n >= text.length) return;
    const id = setTimeout(() => setN(n + 1), n === 0 ? 900 : ms);
    return () => clearTimeout(id);
  }, [n, text, ms]);
  return text.slice(0, n);
}

/* ---------- Sections ---------- */
function Header() {
  const [open, setOpen] = useState(false);
  return (
    <header className="sticky z-50 border-b border-white/10 bg-[#08090C]/90 backdrop-blur" style={{ top: 'env(safe-area-inset-top,0px)' }}>
      <nav aria-label="Main" className="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
        <a href="#top" className="font-bold tracking-tight text-[#00FF9C]">GOODFELLAS</a>
        <button className="md:hidden border border-white/15 rounded px-3 py-1.5 text-sm" aria-expanded={open} aria-controls="menu" onClick={() => setOpen(!open)}>{open ? 'Close' : 'Menu'}</button>
        <ul id="menu" className={`${open ? 'flex' : 'hidden'} absolute left-0 right-0 top-16 flex-col gap-1 border-b border-white/10 bg-[#08090C] p-4 md:static md:flex md:flex-row md:border-0 md:bg-transparent md:p-0`}>
          {NAV.map(n => <li key={n}><a href={`#${n.toLowerCase()}`} onClick={() => setOpen(false)} className="block rounded px-3 py-2 text-sm text-[#8B95A1] transition hover:text-[#00FF9C]">{n}</a></li>)}
        </ul>
      </nav>
    </header>);
}

function Hero() {
  const typed = useTyped(SLOGAN);
  return (
    <section id="top" className="relative isolate overflow-hidden">
      <div className="grid-bg absolute inset-0 -z-10" aria-hidden="true" />
      <div className="mx-auto grid max-w-6xl gap-12 px-5 py-20 md:py-28 lg:grid-cols-[1.2fr_1fr] lg:items-center">
        <div>
          <p className="mb-4 text-sm text-[#8B95A1]">competitive CTF team</p>
          <h1 className="boot glow text-5xl font-extrabold leading-none text-[#00FF9C] sm:text-7xl lg:text-8xl">GOODFELLAS</h1>
          <p className="mt-6 min-h-[2.5rem] text-lg sm:text-2xl" aria-label={SLOGAN}><span aria-hidden="true">{typed}<span className="caret">&nbsp;</span></span></p>
          <div className="mt-9 flex flex-wrap gap-3">
            <a href="#team" className="rounded bg-[#00FF9C] px-5 py-3 text-sm font-bold text-black transition hover:shadow-[0_0_24px_rgba(0,255,156,.6)]">Meet the team</a>
            <a href="#terminal" className="rounded border border-[#00FF9C]/50 px-5 py-3 text-sm text-[#00FF9C] transition hover:bg-[#00FF9C]/10">Open the terminal</a>
          </div>
        </div>
        <div className="card overflow-hidden" aria-hidden="true">
          <div className="flex items-center gap-1.5 border-b border-white/10 px-4 py-2.5"><i className="h-2.5 w-2.5 rounded-full bg-white/20"/><i className="h-2.5 w-2.5 rounded-full bg-white/20"/><i className="h-2.5 w-2.5 rounded-full bg-[#00FF9C]"/><span className="ml-3 text-xs text-[#8B95A1]">goodfellas ~ session</span></div>
          <pre className="overflow-x-auto p-5 text-sm leading-7 text-[#8B95A1]">{`$ whoami\n`}<span className="text-[#00FF9C]">goodfellas</span>{`\n$ ls team/\n`}{MEMBERS.map(m => m.tag).join('  ')}{`\n$ cat motto.txt\n${SLOGAN}\n$ `}<span className="caret">&nbsp;</span></pre>
        </div>
      </div>
    </section>);
}

function Section({ id, title, children }: { id: string; title: string; children: any }) {
  return (<section id={id} className="mx-auto max-w-6xl px-5 py-16 md:py-24">
    <h2 className="mb-8 text-3xl font-bold tracking-tight sm:text-4xl"><span className="text-[#00FF9C]">~/</span>{title}</h2>{children}</section>);
}

function About() {
  return (<Section id="about" title="about">
    <div className="max-w-2xl space-y-4 text-[#B8C2CC] leading-7">
      <p>We are cybersecurity enthusiasts who like a locked door as a personal invitation. GOODFELLAS plays capture-the-flag competitions to sharpen real security skills, one hard problem at a time.</p>
      <p>Every challenge is a puzzle with a story behind it: read it, break it, understand why it broke, then write it down so the next person learns faster.</p>
    </div></Section>);
}

function Team() {
  return (<Section id="team" title="team">
    <ul className="grid gap-5 md:grid-cols-3">
      {MEMBERS.map(m => (
        <li key={m.tag} className="card flex flex-col p-6">
          <h3 className="glow break-words text-3xl font-extrabold text-[#00FF9C]">{m.tag}</h3>
          <p className="mt-1 text-[#B8C2CC]">{m.name}</p>
          <div className="mt-8 flex gap-3 border-t border-white/10 pt-5" role="group" aria-label={`${m.tag} social links`}>
            {m.socials.map(s => <Social key={s.platform} platform={s.platform} url={s.url} who={m.name} />)}
          </div>
        </li>))}
    </ul></Section>);
}

function Expertise() {
  return (<Section id="expertise" title="expertise">
    <ul className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      {EXPERTISE.map(e => (<li key={e.t} className="card p-5">
        <span className="mb-4 inline-block rounded border border-[#00FF9C]/40 px-2 py-1 text-sm text-[#00FF9C]" aria-hidden="true">{e.g}</span>
        <h3 className="font-bold">{e.t}</h3><p className="mt-2 text-sm leading-6 text-[#8B95A1]">{e.d}</p></li>))}
    </ul></Section>);
}

/* ---------- Simulated terminal: no real commands, no network ---------- */
const COMMANDS: Record<string, () => string[]> = {
  help: () => ['Available commands:', '  help       list commands', '  about      what GOODFELLAS is', '  team       the team at a glance', '  members    members with profile links', '  expertise  our focus areas', '  whoami     your session', '  date       current date and time', '  clear      clear the screen'],
  about: () => ['GOODFELLAS: a competitive CTF team.', SLOGAN],
  team: () => [`${MEMBERS.length} members: ${MEMBERS.map(m => m.tag).join(', ')}`],
  members: () => MEMBERS.flatMap(m => [`${m.tag} (${m.name})`, ...m.socials.map(s => `  ${s.platform.padEnd(10)} ${s.url}`)]),
  expertise: () => EXPERTISE.map(e => `  ${e.t}`),
  whoami: () => ['guest@goodfellas', 'read-only visitor session (simulated)'],
  date: () => [new Date().toString()],
};
function Terminal() {
  const [lines, setLines] = useState<string[]>(["GOODFELLAS terminal (simulated). Type 'help' to begin."]);
  const [val, setVal] = useState('');
  const box = useRef<HTMLDivElement>(null);
  const inp = useRef<HTMLInputElement>(null);
  useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [lines]);
  const run = (e: any) => {
    e.preventDefault();
    const cmd = val.trim().toLowerCase();
    setVal('');
    if (!cmd) return;
    if (cmd === 'clear') return setLines([]);
    const out = COMMANDS[cmd] ? COMMANDS[cmd]() : [`command not found: ${cmd.slice(0, 40)}. Type 'help'.`];
    setLines(l => [...l, `guest@goodfellas:~$ ${val.trim().slice(0, 40)}`, ...out]);
  };
  return (<Section id="terminal" title="terminal">
    <div className="card overflow-hidden" onClick={() => inp.current?.focus()}>
      <div ref={box} className="h-72 overflow-y-auto p-5 text-sm leading-6" role="log" aria-live="polite">
        {lines.map((l, i) => <div key={i} className={`whitespace-pre-wrap break-words ${l.startsWith('guest@') ? 'text-[#00FF9C]' : 'text-[#B8C2CC]'}`}>{l}</div>)}
      </div>
      <form onSubmit={run} className="flex items-center gap-2 border-t border-white/10 px-5 py-3 text-sm">
        <label htmlFor="cmd" className="shrink-0 text-[#00FF9C]">guest@goodfellas:~$</label>
        <input id="cmd" ref={inp} value={val} onChange={e => setVal(e.target.value)} autoComplete="off" autoCapitalize="off" spellCheck={false} maxLength={40} className="min-w-0 flex-1 bg-transparent text-[#E6EDF3] outline-none" />
      </form>
    </div></Section>);
}

function Records() {
  return (<Section id="records" title="records">
    <div className="card border-dashed p-8">
      <p className="text-[#B8C2CC]">No competitions logged yet. When we play, results will appear here.</p>
      <ul className="mt-6 grid gap-3 text-sm text-[#8B95A1] sm:grid-cols-3">
        {['Competitions', 'Scores and rankings', 'Write-ups'].map(t => <li key={t} className="rounded border border-dashed border-white/15 p-4"><span className="text-[#E6EDF3]">{t}</span><br />Coming soon</li>)}
      </ul>
    </div></Section>);
}

function Footer() {
  return (<footer id="contact" className="border-t border-white/10">
    <div className="mx-auto max-w-6xl px-5 py-14">
      <h2 className="mb-3 text-3xl font-bold tracking-tight"><span className="text-[#00FF9C]">~/</span>contact</h2>
      <p className="mb-6 max-w-xl text-[#B8C2CC]">Want to talk CTFs or team up? Reach any of us through our profiles.</p>
      <ul className="flex flex-wrap gap-x-10 gap-y-6">
        {MEMBERS.map(m => (<li key={m.tag}><p className="mb-2 text-sm text-[#8B95A1]">{m.tag}</p>
          <div className="flex gap-3">{m.socials.map(s => <Social key={s.platform} platform={s.platform} url={s.url} who={m.name} />)}</div></li>))}
      </ul>
      <p className="mt-14 text-sm text-[#8B95A1]">GOODFELLAS — Root the Impossible. Rise Unstoppable. SMW. UP51. Peace</p>
    </div></footer>);
}

function App() {
  return (<><Header /><main id="main" className="relative z-10"><Hero /><About /><Team /><Expertise /><Terminal /><Records /></main><div className="relative z-10"><Footer /></div></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
try {
  var out = Babel.transform(document.getElementById('src').textContent, { presets: [['typescript', { isTSX: true, allExtensions: true }], 'react'] }).code;
  (0, eval)(out);
} catch (e) {
  document.getElementById('root').innerHTML = '<p style="padding:2rem;color:#00FF9C">GOODFELLAS failed to load. Please refresh.</p>';
  console.error(e);
}
</script>
<noscript><p style="padding:2rem;color:#00FF9C">GOODFELLAS — Root the Impossible. Rise Unstoppable. Please enable JavaScript.</p></noscript>
</body>
